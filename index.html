<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040a1c">
<meta name="description" content="Self Aware by Temper City">
<title>Self Aware - Temper City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  /* Layout: one centered 3D deck floating over a perspective grid floor. A vinyl disc sits inside a live radial spectrum ring; the embossed play key is the brightest thing on the page. */
  --ink-0: #040a1c;
  --ink-1: #081330;
  --ink-2: #0e2150;
  --blue: #3a78ff;
  --ice: #8fd3ff;
  --text: #e9f1ff;
  --muted: #8196c6;
  --line: rgba(143, 211, 255, 0.16);
  --edge: #1b3f9e;
  --f-display: 'Unbounded', 'Trebuchet MS', sans-serif;
  --f-body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html { background: var(--ink-0); }

body {
  margin: 0;
  min-height: 100dvh;
  background: var(--ink-0);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 20px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}

/* ---------- background ---------- */
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background:
    radial-gradient(60% 50% at 20% 8%, rgba(58, 120, 255, 0.28), transparent 70%),
    radial-gradient(50% 45% at 85% 20%, rgba(143, 211, 255, 0.14), transparent 70%),
    linear-gradient(180deg, var(--ink-1) 0%, var(--ink-0) 70%);
}
.floor {
  position: absolute; left: -50%; right: -50%; bottom: -8%; height: 62%;
  transform-origin: 50% 100%;
  transform: perspective(600px) rotateX(64deg);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 64px 64px;
  -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 85%);
  mask-image: linear-gradient(to top, #000 10%, transparent 85%);
}
.playing-page .floor { animation: glide 2.4s linear infinite; }
@keyframes glide { to { background-position: 0 64px, 0 0; } }

/* ---------- layout ---------- */
.stage { position: relative; z-index: 1; width: min(100%, 460px); margin-inline: auto; display: flex; flex-direction: column; gap: 22px; }

.topbar { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
.brand { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
.brand b { color: var(--ice); font-weight: 500; }

.pick {
  font: 500 13px var(--f-body); color: var(--text); cursor: pointer;
  background: rgba(58, 120, 255, 0.14); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px;
  transition: background 0.15s, border-color 0.15s;
}
.pick:hover { background: rgba(58, 120, 255, 0.28); border-color: rgba(143, 211, 255, 0.4); }

button, input { font-family: inherit; }
:focus-visible { outline: 2px solid var(--ice); outline-offset: 3px; }

/* ---------- 3D scene ---------- */
.scene { perspective: 1300px; }

.card {
  position: relative;
  transform-style: preserve-3d;
  transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transition: transform 0.18s ease-out;
  padding: 26px 26px 30px;
  display: flex; flex-direction: column; gap: 22px;
}
.plate {
  position: absolute; inset: 0; border-radius: 30px;
  background: linear-gradient(160deg, rgba(24, 52, 122, 0.82) 0%, rgba(8, 19, 52, 0.94) 60%);
  border: 1px solid var(--line);
  box-shadow: 0 50px 90px -20px rgba(0, 4, 24, 0.85), 0 0 0 1px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.09);
  transform: translateZ(-2px);
}
.card > * { position: relative; }
.card > .plate { position: absolute; }

/* disc + spectrum */
.discwrap { width: min(100%, 340px); aspect-ratio: 1; margin-inline: auto; transform-style: preserve-3d; transform: translateZ(26px); }
.discwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.platter {
  position: absolute; left: 13%; top: 13%; width: 74%; height: 74%; border-radius: 50%;
  box-shadow: 0 24px 40px rgba(0, 4, 28, 0.75), 0 0 calc(12px + var(--beat, 0) * 46px) rgba(58, 120, 255, calc(0.18 + var(--beat, 0) * 0.6));
}
.ripple {
  position: absolute; left: 13%; top: 13%; width: 74%; height: 74%; border-radius: 50%;
  border: 1px solid var(--ice); opacity: 0; pointer-events: none;
}
.playing .ripple { animation: ripple 2.6s ease-out infinite; }
.playing .ripple.r2 { animation-delay: 1.3s; }
@keyframes ripple { from { transform: scale(1); opacity: 0.4; } to { transform: scale(1.34); opacity: 0; } }
.disc {
  position: absolute; inset: 0; border-radius: 50%;
  background:
    radial-gradient(circle at 50% 50%, transparent 0 31%, rgba(0, 0, 0, 0.0) 31%),
    repeating-radial-gradient(circle at 50% 50%, rgba(143, 211, 255, 0.07) 0 1px, transparent 1px 4px),
    conic-gradient(from 20deg, #0a1a4a, #16337d, #0a1a4a 25%, #1d4296 40%, #0a1a4a 55%, #14307a 75%, #0a1a4a);
  box-shadow: 0 0 0 2px rgba(143, 211, 255, 0.18), inset 0 0 30px rgba(0, 0, 0, 0.55);
  display: grid; place-items: center;
  animation: spin 11s linear infinite; animation-play-state: paused;
}
.playing .disc { animation-play-state: running; }
@keyframes spin { to { transform: rotate(360deg); } }
.label {
  width: 34%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #cfeaff, var(--ice) 35%, var(--blue) 100%);
  display: grid; place-items: center; color: #06143a;
  font: 700 clamp(20px, 7vw, 30px) var(--f-display);
  box-shadow: inset 0 -4px 8px rgba(10, 40, 140, 0.5), 0 0 0 5px rgba(4, 10, 28, 0.6);
  position: relative;
}
.label b { font-weight: 700; line-height: 1; }
.shine {
  position: absolute; left: 13%; top: 13%; width: 74%; height: 74%; border-radius: 50%; pointer-events: none;
  background: conic-gradient(from 300deg, transparent 0 8%, rgba(255, 255, 255, 0.14) 14%, transparent 22% 58%, rgba(143, 211, 255, 0.12) 66%, transparent 74%);
  transform: translateZ(2px);
}

/* tonearm: rests off the record, swings onto it when a song plays */
.arm {
  position: absolute; left: 86%; top: 5%; width: 6px; height: 50%; margin-left: -3px; pointer-events: none;
  transform-origin: 3px 0; transform: translateZ(12px) rotate(-8deg);
  transition: transform 1.1s cubic-bezier(0.4, 0.1, 0.2, 1);
}
.playing .arm { transform: translateZ(12px) rotate(22deg); }
.arm-bar { position: absolute; inset: 0; border-radius: 4px; transform-origin: 50% 0;
  background: linear-gradient(90deg, #cfe8ff, #4a7ee0 60%, #1d3f94); box-shadow: 6px 10px 14px rgba(0, 4, 28, 0.55); }
.playing .arm-bar { animation: needle 3.2s ease-in-out 1.2s infinite; }
@keyframes needle { 0%, 100% { transform: rotate(-0.7deg); } 50% { transform: rotate(0.7deg); } }
.head { position: absolute; left: 50%; bottom: -14px; width: 16px; height: 24px; margin-left: -8px; border-radius: 4px; background: linear-gradient(#f2f9ff, #7fb3f5); box-shadow: 0 4px 8px rgba(0, 4, 28, 0.6); }
.pivot { position: absolute; left: 50%; top: -15px; width: 30px; height: 30px; margin-left: -15px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, var(--ice) 40%, var(--blue)); box-shadow: 0 6px 0 -2px var(--edge), 0 10px 18px rgba(0, 4, 28, 0.6); }

/* info */
.info { text-align: center; display: flex; flex-direction: column; gap: 6px; transform: translateZ(34px); }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ice); }
.title { margin: 0; font: 700 clamp(19px, 5.6vw, 24px)/1.2 var(--f-display); text-wrap: balance; overflow-wrap: anywhere; }
.sub { margin: 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }

/* seek */
.seek { display: flex; flex-direction: column; gap: 8px; transform: translateZ(30px); }
.times { display: flex; justify-content: space-between; font: 400 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; cursor: pointer; margin: 0; --p: 0%; }
input[type="range"]:disabled { cursor: default; opacity: 0.55; }
input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 99px; background: linear-gradient(90deg, var(--ice), var(--blue)) 0 / var(--p) 100% no-repeat, rgba(143, 211, 255, 0.16); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; margin-top: -5px; background: radial-gradient(circle at 35% 30%, #fff, var(--ice)); box-shadow: 0 0 0 4px rgba(143, 211, 255, 0.2), 0 4px 10px rgba(0, 0, 0, 0.5); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 99px; background: rgba(143, 211, 255, 0.16); }
input[type="range"]::-moz-range-progress { height: 6px; border-radius: 99px; background: linear-gradient(90deg, var(--ice), var(--blue)); }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--ice)); box-shadow: 0 0 0 4px rgba(143, 211, 255, 0.2), 0 4px 10px rgba(0, 0, 0, 0.5); }

/* controls */
.controls { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 3.4vw, 18px); transform-style: preserve-3d; padding-block: 10px 14px; }
.key {
  width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--text);
  border: 1px solid var(--line);
  background: radial-gradient(circle at 35% 25%, rgba(143, 211, 255, 0.22), rgba(14, 33, 80, 0.9) 70%);
  box-shadow: 0 6px 0 -1px #0a1a4a, 0 14px 22px rgba(0, 4, 28, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.14);
  transform: translateZ(36px);
  transition: transform 0.1s, box-shadow 0.1s, color 0.15s;
}
.key:hover { color: var(--ice); }
.key:active { transform: translateZ(36px) translateY(4px); box-shadow: 0 2px 0 -1px #0a1a4a, 0 6px 12px rgba(0, 4, 28, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.14); }
.key[aria-pressed="true"] { color: var(--ice); border-color: rgba(143, 211, 255, 0.55); box-shadow: 0 6px 0 -1px #0a1a4a, 0 0 18px rgba(58, 120, 255, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.14); }
.key svg { width: 20px; height: 20px; }

.play {
  width: 94px; height: 94px; border-radius: 50%; border: 0; cursor: pointer; color: #06143a; display: grid; place-items: center;
  background: radial-gradient(circle at 32% 24%, #ffffff 0%, #d4edff 16%, var(--ice) 46%, var(--blue) 100%);
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.8) inset,
    0 -7px 14px rgba(10, 40, 140, 0.55) inset,
    0 14px 0 -2px var(--edge),
    0 28px 38px rgba(0, 8, 44, 0.75),
    0 0 calc(34px + var(--beat, 0) * 60px) rgba(58, 120, 255, calc(0.32 + var(--beat, 0) * 0.5));
  transform: translateZ(74px);
  transition: transform 0.1s, box-shadow 0.1s;
}
.play:hover { filter: brightness(1.06); }
.play:active {
  transform: translateZ(74px) translateY(9px);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset, 0 -7px 14px rgba(10, 40, 140, 0.55) inset, 0 5px 0 -2px var(--edge), 0 12px 20px rgba(0, 8, 44, 0.75), 0 0 34px rgba(58, 120, 255, 0.5);
}
.play svg { width: 40px; height: 40px; }

/* volume */
.volume { display: flex; align-items: center; gap: 12px; transform: translateZ(20px); color: var(--muted); }
.volume svg { width: 18px; height: 18px; flex: none; }

/* queue */
.queue { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.queue h2 { font: 500 11px var(--f-mono); letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.queue button {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer;
  background: rgba(14, 33, 80, 0.55); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; color: var(--text); font-size: 14px;
  transition: background 0.15s, border-color 0.15s;
}
.queue button:hover { background: rgba(58, 120, 255, 0.22); }
.queue button[aria-current="true"] { border-color: rgba(143, 211, 255, 0.55); background: rgba(58, 120, 255, 0.24); }
.queue .n { font: 400 12px var(--f-mono); color: var(--ice); flex: none; width: 1.6em; }
.queue .t { min-width: 0; overflow-wrap: anywhere; }

.hint { text-align: center; color: var(--muted); font-size: 13px; margin: 0; }

/* drop veil + toast */
.veil { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: rgba(4, 10, 28, 0.82); font: 700 22px var(--f-display); color: var(--ice); border: 2px dashed var(--ice); }
.dragging .veil { display: grid; }
.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); z-index: 30;
  background: var(--ink-2); border: 1px solid rgba(143, 211, 255, 0.4); color: var(--text); padding: 10px 16px; border-radius: 12px; font-size: 14px;
  max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 420px) {
  .card { padding: 20px 18px 24px; }
  .play { width: 84px; height: 84px; }
  .key { width: 42px; height: 42px; }
}
@media (prefers-reduced-motion: reduce) {
  .disc, .playing-page .floor, .playing .ripple, .playing .arm-bar { animation: none; }
  .arm { transition: none; }
  .card { transition: none; }
}
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><div class="floor"></div></div>

<main class="stage" id="stage">
  <div class="topbar">
    <button class="pick" id="pick" type="button">Choose song</button>
  </div>

  <div class="scene" id="scene">
    <section class="card" id="card" aria-label="Music player">
      <div class="plate"></div>

      <div class="discwrap">
        <canvas id="viz" aria-hidden="true"></canvas>
        <div class="ripple" aria-hidden="true"></div><div class="ripple r2" aria-hidden="true"></div>
        <div class="platter" aria-hidden="true"><div class="disc"><div class="label"><b id="initial">S</b></div></div></div>
        <div class="shine"></div>
        <div class="arm" aria-hidden="true"><div class="arm-bar"><i class="head"></i></div><i class="pivot"></i></div>
      </div>

      <div class="info">
        <div class="eyebrow" id="eyebrow">Ready</div>
        <h1 class="title" id="title">Self Aware</h1>
        <p class="sub" id="sub">Temper City</p>
      </div>

      <div class="seek">
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek" disabled>
        <div class="times"><span id="tcur">0:00</span><span id="tdur">0:00</span></div>
      </div>

      <div class="controls">
        <button class="key" id="loop" type="button" aria-pressed="false" aria-label="Repeat track">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>
        </button>
        <button class="key" id="prev" type="button" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <button class="play" id="play" type="button" aria-label="Play" aria-pressed="false">
          <svg id="icPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6a.6.6 0 0 0 .9.5l11-6.8a.6.6 0 0 0 0-1L8.9 4.7a.6.6 0 0 0-.9.5z"/></svg>
          <svg id="icPause" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>
        </button>
        <button class="key" id="next" type="button" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg>
        </button>
        <button class="key" id="mute" type="button" aria-pressed="false" aria-label="Mute">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor" stroke="none"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        </button>
      </div>

      <div class="volume">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/></svg>
        <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume">
      </div>
    </section>
  </div>

  <ol class="queue" id="queue" hidden></ol>
  <p class="hint" id="hint">Press play and choose your Self Aware file, or drop it anywhere on the page.</p>
</main>

<input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.opus,.flac" multiple hidden>
<audio id="audio" preload="metadata"></audio>
<div class="veil" aria-hidden="true">Drop to play</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var audio = $('#audio'), card = $('#card'), scene = $('#scene'), playBtn = $('#play');
  var icPlay = $('#icPlay'), icPause = $('#icPause'), seek = $('#seek'), vol = $('#vol');
  var tcur = $('#tcur'), tdur = $('#tdur'), titleEl = $('#title'), subEl = $('#sub'), eyebrow = $('#eyebrow');
  var fileIn = $('#file'), queueEl = $('#queue'), hint = $('#hint'), initial = $('#initial');
  var cv = $('#viz'), toastEl = $('#toast');
  var cs = getComputedStyle(document.documentElement);
  var ICE = cs.getPropertyValue('--ice').trim() || '#8fd3ff';
  var BLUE = cs.getPropertyValue('--blue').trim() || '#3a78ff';
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  var PRESET = { title: 'Self Aware', artist: 'Temper City' };
  var tracks = [], idx = -1, ctx = null, analyser = null, data = null, playing = false, beat = 0, raf = 0, toastT = 0;

  function fmt(t) {
    if (!isFinite(t) || t < 0) return '0:00';
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('show'); }, 3200);
  }
  function parseName(name) {
    var base = name.replace(/\.[a-z0-9]{2,5}$/i, '').replace(/[_]+/g, ' ').trim();
    var m = base.match(/^(.+?)\s+-\s+(.+)$/);
    if (m) return { artist: m[1].trim(), title: m[2].trim() };
    return { artist: 'Your track', title: base || 'Untitled' };
  }

  function setPlaying(on) {
    playing = on;
    card.classList.toggle('playing', on);
    document.body.classList.toggle('playing-page', on);
    icPlay.hidden = on; icPause.hidden = !on;
    playBtn.setAttribute('aria-label', on ? 'Pause' : 'Play');
    playBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (idx >= 0) eyebrow.textContent = on ? 'Now playing' : 'Paused';
  }

  function ensureCtx() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      var src = ctx.createMediaElementSource(audio);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.82;
      src.connect(analyser); analyser.connect(ctx.destination);
      data = new Uint8Array(analyser.frequencyBinCount);
    } catch (e) { ctx = null; analyser = null; }
  }

  function updateSeek() {
    var d = audio.duration, c = audio.currentTime;
    if (isFinite(d) && d > 0) {
      var p = c / d;
      seek.value = Math.round(p * 1000);
      seek.style.setProperty('--p', (p * 100).toFixed(2) + '%');
      tdur.textContent = fmt(d);
    }
    tcur.textContent = fmt(c);
  }

  function load(i, autoplay) {
    if (i < 0 || i >= tracks.length) return;
    idx = i;
    var t = tracks[i];
    audio.src = t.url;
    titleEl.textContent = t.title;
    subEl.textContent = t.artist;
    try { if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist }); } catch (e) {}
    initial.textContent = (t.title.charAt(0) || '?').toUpperCase();
    eyebrow.textContent = 'Ready';
    seek.disabled = false; seek.value = 0; seek.style.setProperty('--p', '0%');
    tcur.textContent = '0:00'; tdur.textContent = '0:00';
    hint.hidden = true;
    renderQueue();
    if (autoplay) play();
  }

  function play() {
    if (idx < 0) { fileIn.click(); return; }
    ensureCtx();
    var p = audio.play();
    if (p && p.catch) p.catch(function () { setPlaying(false); toast('Could not play this file. Try an MP3, WAV, M4A or OGG.'); });
  }
  function pause() { audio.pause(); }

  function step(dir) {
    if (idx < 0) { fileIn.click(); return; }
    if (tracks.length > 1) {
      if (dir < 0 && audio.currentTime > 3) { audio.currentTime = 0; return; }
      load((idx + dir + tracks.length) % tracks.length, true);
    } else {
      var d = isFinite(audio.duration) ? audio.duration : 0;
      audio.currentTime = Math.max(0, Math.min(d, audio.currentTime + dir * 10));
    }
  }

  function addFiles(files) {
    var list = Array.prototype.slice.call(files).filter(function (f) {
      return /^audio\//.test(f.type) || /\.(mp3|wav|ogg|m4a|aac|flac|opus|webm)$/i.test(f.name);
    });
    if (!list.length) { toast('That is not an audio file. Try an MP3, WAV, M4A or OGG.'); return; }
    var start = tracks.length;
    list.forEach(function (f, j) {
      var n = parseName(f.name);
      if (start === 0 && j === 0) n = PRESET;
      tracks.push({ file: f, url: URL.createObjectURL(f), title: n.title, artist: n.artist, fallback: false });
    });
    load(start, true);
  }

  function renderQueue() {
    if (tracks.length < 2) { queueEl.hidden = true; queueEl.innerHTML = ''; return; }
    queueEl.hidden = false;
    queueEl.innerHTML = '<h2>Queue</h2>';
    tracks.forEach(function (t, i) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      if (i === idx) b.setAttribute('aria-current', 'true');
      var n = document.createElement('span'); n.className = 'n'; n.textContent = String(i + 1).padStart(2, '0');
      var s = document.createElement('span'); s.className = 't'; s.textContent = t.title;
      b.appendChild(n); b.appendChild(s);
      b.addEventListener('click', function () { load(i, true); });
      li.appendChild(b); queueEl.appendChild(li);
    });
  }

  /* ---------- audio events ---------- */
  audio.addEventListener('play', function () { setPlaying(true); });
  audio.addEventListener('pause', function () { setPlaying(false); });
  audio.addEventListener('loadedmetadata', updateSeek);
  audio.addEventListener('timeupdate', updateSeek);
  audio.addEventListener('ended', function () {
    if (tracks.length > 1 && idx < tracks.length - 1) load(idx + 1, true);
    else { setPlaying(false); audio.currentTime = 0; updateSeek(); eyebrow.textContent = 'Finished'; }
  });
  audio.addEventListener('error', function () {
    var t = tracks[idx];
    if (t && t.file && !t.fallback) {
      t.fallback = true;
      var r = new FileReader();
      r.onload = function () { audio.src = r.result; audio.load(); play(); };
      r.onerror = function () { toast('This file could not be loaded.'); };
      r.readAsDataURL(t.file);
    } else if (t) {
      toast('This file could not be played. Try an MP3, WAV, M4A or OGG.');
    }
  });

  /* ---------- controls ---------- */
  playBtn.addEventListener('click', function () { if (audio.paused) play(); else pause(); });
  $('#prev').addEventListener('click', function () { step(-1); });
  $('#next').addEventListener('click', function () { step(1); });
  $('#pick').addEventListener('click', function () { fileIn.click(); });
  fileIn.addEventListener('change', function () { if (fileIn.files.length) addFiles(fileIn.files); fileIn.value = ''; });

  var loopBtn = $('#loop');
  loopBtn.addEventListener('click', function () {
    audio.loop = !audio.loop;
    loopBtn.setAttribute('aria-pressed', audio.loop ? 'true' : 'false');
  });

  seek.addEventListener('input', function () {
    var d = audio.duration;
    if (isFinite(d) && d > 0) { audio.currentTime = (seek.value / 1000) * d; updateSeek(); }
  });

  function applyVol() {
    audio.volume = vol.value / 100;
    vol.style.setProperty('--p', vol.value + '%');
  }
  vol.addEventListener('input', function () { if (audio.muted) { audio.muted = false; muteBtn.setAttribute('aria-pressed', 'false'); } applyVol(); });
  var muteBtn = $('#mute');
  muteBtn.addEventListener('click', function () {
    audio.muted = !audio.muted;
    muteBtn.setAttribute('aria-pressed', audio.muted ? 'true' : 'false');
    muteBtn.setAttribute('aria-label', audio.muted ? 'Unmute' : 'Mute');
  });
  applyVol();

  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'BUTTON') return;
    if (e.code === 'Space') { e.preventDefault(); if (audio.paused) play(); else pause(); }
    else if (e.code === 'ArrowRight') { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5); }
    else if (e.code === 'ArrowLeft') { audio.currentTime = Math.max(0, audio.currentTime - 5); }
  });

  /* ---------- drag and drop ---------- */
  var dragDepth = 0;
  window.addEventListener('dragenter', function (e) { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
  window.addEventListener('dragleave', function () { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('dragging'); });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
    if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  /* ---------- 3D tilt ---------- */
  if (!reduced) {
    scene.addEventListener('pointermove', function (e) {
      var r = scene.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
      card.style.setProperty('--ry', (x * 14).toFixed(2) + 'deg');
      card.style.setProperty('--rx', (-y * 12).toFixed(2) + 'deg');
    });
    scene.addEventListener('pointerleave', function () {
      card.style.setProperty('--ry', '0deg'); card.style.setProperty('--rx', '0deg');
    });
  }

  /* ---------- spectrum ring ---------- */
  function frame(t) {
    raf = requestAnimationFrame(frame);
    var w = cv.clientWidth;
    if (!w) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1), px = Math.round(w * dpr);
    if (cv.width !== px) { cv.width = px; cv.height = px; }
    var g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, w);

    var live = playing && analyser && data;
    if (live) analyser.getByteFrequencyData(data);

    var N = 72, half = N / 2, cx = w / 2, r0 = w * 0.405, maxLen = w * 0.085;
    var grad = g.createLinearGradient(0, 0, w, w);
    grad.addColorStop(0, ICE); grad.addColorStop(1, BLUE);
    g.strokeStyle = grad; g.lineCap = 'round'; g.lineWidth = Math.max(2, w * 0.009);

    for (var i = 0; i < N; i++) {
      var k = i < half ? i : N - 1 - i, v;
      if (live) {
        v = Math.pow(data[2 + Math.floor(k * (70 / half))] / 255, 1.5);
      } else {
        v = reduced ? 0.1 : 0.1 + 0.06 * Math.sin(t / 900 + k * 0.45) + 0.03 * Math.sin(t / 1500 + k * 0.9);
      }
      var a = (i / N) * Math.PI * 2 - Math.PI / 2, len = 3 + v * maxLen;
      g.beginPath();
      g.moveTo(cx + Math.cos(a) * r0, cx + Math.sin(a) * r0);
      g.lineTo(cx + Math.cos(a) * (r0 + len), cx + Math.sin(a) * (r0 + len));
      g.stroke();
    }

    var bass = 0;
    if (live) { for (var b = 1; b < 7; b++) bass += data[b]; bass = bass / 6 / 255; }
    beat = beat * 0.8 + bass * 0.2;
    card.style.setProperty('--beat', beat.toFixed(3));
    if (playing && !audio.paused) updateSeek();
  }
  tracks.push({ url: 'self-aware.mp3', title: PRESET.title, artist: PRESET.artist, fallback: true });
  load(0, false);
  raf = requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) cancelAnimationFrame(raf); else raf = requestAnimationFrame(frame);
  });
})();
</script>

</body>
</html>
